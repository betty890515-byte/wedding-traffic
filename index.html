<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交通位置｜俊賢＆佳宜的婚禮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF7F4;
    --hero: #FBD9D6;
    --surface: #FFFFFF;
    --ink: #6B5555;
    --ink-soft: #8A7373;
    --pink: #E98A8F;
    --pink-deep: #C75862;
    --berry: #E0525E;
    --butter: #F6DF7E;
    --line: #F1D3CF;
    --on-pink: #FFFFFF;
    --flower: #F4A9AE;
    --flower-core: #FFF3EA;
    --olive: #B3AB55;
    --line-strong: #E8B4B0;
    --park: #2F9FDA;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2B2123; --hero: #4A3033; --surface: #382B2E;
      --ink: #F4E6E3; --ink-soft: #CDB5B2; --pink: #EE9A9E; --pink-deep: #F2A9AC;
      --berry: #F0707A; --butter: #E9D277; --line: #5A4346; --on-pink: #3A2326;
      --flower: #D98A90; --flower-core: #F6E4DC; --olive: #9A9449; --line-strong: #7A5A5E; --park: #5DB8E8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2B2123; --hero: #4A3033; --surface: #382B2E;
    --ink: #F4E6E3; --ink-soft: #CDB5B2; --pink: #EE9A9E; --pink-deep: #F2A9AC;
    --berry: #F0707A; --butter: #E9D277; --line: #5A4346; --on-pink: #3A2326;
    --flower: #D98A90; --flower-core: #F6E4DC; --olive: #9A9449; --line-strong: #7A5A5E; --park: #5DB8E8;
    color-scheme: dark;
  }

  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 18px; line-height: 1.8; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px 56px; }
  [hidden] { display: none !important; }

  /* hero: full-bleed, with the invitation's flowers and leaves */
  .hero {
    position: relative; overflow: hidden; background: var(--hero);
    padding: 0 0 100px; text-align: center;
    border-radius: 0 0 50% 50% / 0 0 44px 44px;
  }
  .hero-in { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 20px; }
  .deco { position: absolute; z-index: 0; pointer-events: none; }
  .deco.f2 { width: 74px; height: 74px; bottom: 34px; right: 8px; transform: rotate(18deg); opacity: .95; }
  .deco.s2 { width: 96px; height: 96px; bottom: 30px; left: -14px; transform: rotate(-24deg); }
  .art { position: relative; z-index: 0; margin: 0 auto; max-width: 560px; }
  .art img {
    display: block; width: 100%; height: auto; aspect-ratio: 800 / 587; object-fit: cover; object-position: 50% 40%;
    -webkit-mask-image: linear-gradient(to bottom, #000 91%, transparent);
    mask-image: linear-gradient(to bottom, #000 91%, transparent);
  }
  @media (min-width: 561px) {
    .art img {
      -webkit-mask-image: linear-gradient(to bottom, #000 91%, transparent), linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(to bottom, #000 91%, transparent), linear-gradient(to right, transparent, #000 10%, #000 90%, transparent);
      mask-composite: intersect;
    }
  }
  .names { font-family: "Huninn","Noto Sans TC",sans-serif; font-size: 30px; line-height: 1.25; letter-spacing: .05em; margin: 2px 0 0; }
  .names .heart { color: var(--berry); margin: 0 .22em; font-size: .72em; }
  .when { margin: 12px auto 0; max-width: 300px; border-top: 1.5px solid var(--line-strong); border-bottom: 1.5px solid var(--line-strong); padding: 10px 0 8px; }
  .date { font-family: "Huninn","Noto Sans TC",sans-serif; font-size: 28px; line-height: 1.2; margin: 0; color: var(--ink); letter-spacing: .06em; }
  .date small { font-size: 20px; color: var(--pink-deep); margin-left: .25em; letter-spacing: 0; }
  .time { margin: 4px 0 0; color: var(--ink); font-size: 18px; font-weight: 500; }
  .tip {
    display: inline-block; margin: 16px 0 0; padding: 5px 18px; border-radius: 999px;
    background: var(--butter); color: #5A4A2A; font-weight: 700; font-size: 17px; line-height: 1.5;
  }
  .treat { margin: 10px 0 0; font-size: 17px; color: var(--ink); }

  /* destination */
  .dest {
    background: var(--surface); border: 2px dashed var(--line); border-radius: 22px;
    margin-top: -44px; padding: 22px 20px 18px; text-align: center; position: relative; z-index: 2;
  }
  .where { font-family: "Huninn","Noto Sans TC",sans-serif; font-size: 27px; line-height: 1.35; margin: 0; }
  .addr { margin: 4px 0 0; color: var(--ink-soft); font-size: 17px; }
  .btn {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 56px; padding: 6px 18px; border-radius: 999px;
    font: inherit; font-weight: 700; font-size: 18px; text-decoration: none; cursor: pointer;
    border: 2px solid var(--pink); color: var(--pink-deep); background: transparent;
  }
  .btn.primary { background: var(--pink); color: var(--on-pink); width: 100%; margin-top: 16px; }
  .btn:focus-visible, .linkbtn:focus-visible, .seg button:focus-visible, .zoom:focus-visible { outline: 3px solid var(--butter); outline-offset: 3px; }
  .btn:active { transform: translateY(1px); }
  .alt { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 20px; margin-top: 10px; }
  .linkbtn {
    font: inherit; font-size: 16px; color: var(--ink-soft); background: none; border: 0; cursor: pointer;
    text-decoration: underline; text-underline-offset: 4px; padding: 8px 4px; min-height: 44px;
  }

  /* arrival mode picker */
  .modes { margin-top: 34px; }
  h2.sec {
    font-family: "Huninn","Noto Sans TC",sans-serif; font-size: 23px; margin: 0 0 12px;
    padding-left: 14px; border-left: 6px solid var(--butter); line-height: 1.3;
  }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg button {
    min-height: 60px; border-radius: 16px; font: inherit; font-weight: 700; font-size: 19px;
    border: 2px solid var(--line); background: var(--surface); color: var(--ink-soft); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--pink); background: var(--pink); color: var(--on-pink); }
  .panel { margin-top: 14px; background: var(--surface); border: 2px dashed var(--line); border-radius: 22px; padding: 22px 20px; }
  .panel h3 { font-family: "Huninn","Noto Sans TC",sans-serif; font-size: 21px; margin: 0 0 6px; line-height: 1.35; }
  .panel p { margin: 0 0 10px; white-space: pre-line; }
  .panel .empty { color: var(--ink-soft); margin: 0; }
  .steps { margin: 6px 0 14px; padding-left: 1.3em; }
  .steps li { margin: 6px 0; }

  .zoom { display: block; width: 100%; padding: 0; margin: 0 0 6px; border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--hero); cursor: zoom-in; position: relative; }
  .zoom img { display: block; width: 100%; height: auto; }
  .zoom .hint { position: absolute; left: 10px; bottom: 10px; background: rgba(60,40,42,.78); color: #fff; font-size: 15px; padding: 2px 12px; border-radius: 999px; }
  .caption { color: var(--ink-soft); font-size: 15px; margin: 0 0 4px; }

  .spot { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; display: grid; grid-template-columns: 40px 1fr; gap: 0 12px; }
  .spot:first-of-type { border-top: 0; }
  .badge {
    width: 40px; height: 40px; border-radius: 50%; background: var(--park); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; margin-top: 2px;
  }
  .spot h3 { margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .chip { font-size: 15px; line-height: 1.4; padding: 2px 12px; border-radius: 999px; background: var(--hero); color: var(--ink); }
  .chip.rec { background: var(--butter); color: #5A4A2A; font-weight: 700; }
  .spot .btn { min-height: 50px; font-size: 17px; margin-top: 6px; }
  .spot .body { grid-column: 2; }

  /* big map: edge to edge */
  .mapsec { margin-top: 34px; }
  .mapsec .zoom {
    width: calc(100% + 40px); margin: 0 -20px; border-left: 0; border-right: 0; border-radius: 0;
    background: var(--hero);
  }
  @media (min-width: 521px) {
    .mapsec .zoom { width: 100%; margin: 0; border: 2px solid var(--line); border-radius: 16px; }
  }
  .mapsec .caption { margin: 8px 0 0; font-size: 16px; }
  .legend { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin: 0 4px 0 2px; vertical-align: -1px; }
  .legend.blue { background: var(--park); }
  .legend.red { background: var(--berry); }

  .help { margin-top: 28px; }
  .info { margin-top: 32px; }
  .info p { margin: 0; white-space: pre-line; }

  .foot { margin-top: 44px; text-align: center; color: var(--ink-soft); font-family: "Huninn","Noto Sans TC",sans-serif; }
  .foot .sig { margin-top: 4px; font-size: 20px; color: var(--ink); }

  /* full-screen image viewer */
  .viewer { position: fixed; inset: 0; z-index: 50; background: #1E1416; display: flex; flex-direction: column; }
  .viewer .bar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; color: #fff; font-size: 16px;
  }
  .viewer .bar button {
    font: inherit; font-weight: 700; color: #fff; background: rgba(255,255,255,.16);
    border: 0; border-radius: 999px; min-height: 44px; padding: 0 20px; cursor: pointer;
  }
  .viewer .scroller { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .viewer img { display: block; width: 100%; max-width: none; height: auto; cursor: zoom-in; }
  .viewer.big img { width: min(260%, 2000px); cursor: zoom-out; }

  /* short phones: keep the navigate button on the first screen */
  @media (max-height: 740px) {
    .hero { padding-bottom: 88px; }
    .art img { aspect-ratio: 800 / 470; object-position: 50% 38%; }
    .names { font-size: 26px; }
    .date { font-size: 24px; }
    .when { margin-top: 8px; padding: 6px 0 4px; }
    .tip { margin-top: 10px; }
    .treat { margin-top: 6px; }
  }

  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>

<script>
  // ===== 之後只需要改這一區（留空的欄位會顯示「整理中」或不顯示）=====
  var PARKING = [
    // 有導航連結時填 url（或 query），才會出現導航按鈕；可加 chips（例如 ["免費"]）、recommended: true、note
    { name: "教會停車場", note: "在園區內，位置請看上方圖片。" },
    { name: "路邊周圍停車", note: "橋南路旁，位置請看上方圖片。" },
    { name: "大農田第2停車區", note: "位置請看上方圖片。" }
  ];
  var DRIVE_NOTE = "";   // 開車的共同提醒，例如：假日車多，建議提早抵達
  var TRANSIT = {
    station: "搭捷運到 R22 青埔站",
    steps: ["在 R22 青埔站下車", "出站後，就會看到園區"],
    note: ""             // 例如：下車後的接駁或計程車建議
  };
  var CONTACT = { label: "", tel: "" };   // 當天聯絡人，例如 { label: "花花", tel: "0912345678" }
  var INFO = {
    shuttle: "",         // 接駁資訊
    notes: ""            // 其他提醒
  };
  var DEFAULT_MODE = "drive";   // "drive" 或 "transit"
  // ===================================================================

  var NAME = "Fight.K 覓蜜基地";
  var ADDRESS = "高雄市橋頭區橋南路雅歌巷1號";
  var query = encodeURIComponent(NAME + " " + ADDRESS);
  var googleUrl = "https://www.google.com/maps/search/?api=1&query=" + query;
  var appleUrl = "https://maps.apple.com/?q=" + query;

  // primary navigate button follows the phone's system
  var isApple = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var nav = document.getElementById("nav");
  var navAlt = document.getElementById("navAlt");
  if (isApple) {
    nav.href = appleUrl; nav.textContent = "用 Apple 地圖導航";
    navAlt.href = googleUrl; navAlt.textContent = "改用 Google 地圖";
  } else {
    nav.href = googleUrl; nav.textContent = "用 Google 地圖導航";
    navAlt.href = appleUrl; navAlt.textContent = "改用 Apple 地圖";
  }

  var copyBtn = document.getElementById("copy");
  copyBtn.addEventListener("click", function () {
    function done() {
      copyBtn.textContent = "已複製地址";
      setTimeout(function () { copyBtn.textContent = "複製地址"; }, 2000);
    }
    function fallback() {
      try {
        var t = document.createElement("textarea");
        t.value = ADDRESS; t.setAttribute("readonly", "");
        t.style.position = "fixed"; t.style.opacity = "0";
        document.body.appendChild(t); t.select();
        document.execCommand("copy"); document.body.removeChild(t); done();
      } catch (e) { copyBtn.textContent = "請長按地址複製"; }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ADDRESS).then(done, fallback);
      } else { fallback(); }
    } catch (e) { fallback(); }
  });

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  function link(label, href, cls) {
    var a = el("a", cls || "btn", label);
    a.href = href; a.target = "_blank"; a.rel = "noopener";
    return a;
  }

  // image viewer
  var viewer = document.getElementById("viewer");
  var vimg = document.getElementById("vimg");
  var vhint = document.getElementById("vhint");
  var mapimg = document.getElementById("mapimg");
  function openViewer() {
    vimg.src = mapimg.src; vimg.alt = mapimg.alt;
    viewer.classList.add("big");
    vhint.textContent = "用手指拖曳查看，點圖可縮小";
    viewer.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("vclose").focus();
    centerViewer();
  }
  function centerViewer() {
    var sc = document.getElementById("vscroll");
    var go = function () {
      sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) * 0.55;
      sc.scrollTop = (sc.scrollHeight - sc.clientHeight) / 2;
    };
    go();
    if (!vimg.complete) vimg.addEventListener("load", go, { once: true });
  }
  function closeViewer() { viewer.hidden = true; document.body.style.overflow = ""; }
  document.getElementById("vclose").addEventListener("click", closeViewer);
  vimg.addEventListener("click", function () {
    var big = viewer.classList.toggle("big");
    vhint.textContent = big ? "用手指拖曳查看，點圖可縮小" : "點圖可放大";
    centerViewer();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !viewer.hidden) closeViewer(); });

  var panel = document.getElementById("panel");
  var bTransit = document.getElementById("m-transit");
  var bDrive = document.getElementById("m-drive");

  function renderDrive() {
    panel.textContent = "";
    var hasAny = PARKING.length || DRIVE_NOTE;
    if (!hasAny) { panel.appendChild(el("p", "empty", "停車位置整理中，稍後更新。")); return; }
    if (DRIVE_NOTE) panel.appendChild(el("p", "", DRIVE_NOTE));
    PARKING.forEach(function (p, i) {
      var d = el("div", "spot");
      d.appendChild(el("div", "badge", p.no ? String(p.no) : "P"));
      var body = el("div", "body");
      body.appendChild(el("h3", "", p.name));
      var chips = el("div", "chips");
      if (p.recommended) chips.appendChild(el("span", "chip rec", "建議停這裡"));
      (p.chips || []).forEach(function (c) { chips.appendChild(el("span", "chip", c)); });
      if (chips.childNodes.length) body.appendChild(chips);
      if (p.note) body.appendChild(el("p", "", p.note));
      var href = p.url || (p.query ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.query) : "");
      if (href) body.appendChild(link("導航到這個停車位置", href));
      d.appendChild(body);
      panel.appendChild(d);
    });
  }

  function renderTransit() {
    panel.textContent = "";
    var has = TRANSIT.station || (TRANSIT.steps && TRANSIT.steps.length) || TRANSIT.note;
    if (!has) { panel.appendChild(el("p", "empty", "捷運路線與出站步行方式整理中，稍後更新。")); return; }
    if (TRANSIT.station) panel.appendChild(el("h3", "", TRANSIT.station));
    if (TRANSIT.steps && TRANSIT.steps.length) {
      var ol = el("ol", "steps");
      TRANSIT.steps.forEach(function (t) { ol.appendChild(el("li", "", t)); });
      panel.appendChild(ol);
    }
    if (TRANSIT.note) panel.appendChild(el("p", "", TRANSIT.note));
    panel.appendChild(link("用 Google 地圖規劃大眾運輸路線",
      "https://www.google.com/maps/dir/?api=1&destination=" + query + "&travelmode=transit"));
  }

  function setMode(m) {
    bDrive.setAttribute("aria-pressed", m === "drive" ? "true" : "false");
    bTransit.setAttribute("aria-pressed", m === "transit" ? "true" : "false");
    if (m === "drive") renderDrive(); else renderTransit();
  }
  bDrive.addEventListener("click", function () { setMode("drive"); });
  bTransit.addEventListener("click", function () { setMode("transit"); });
  document.getElementById("mapzoom").addEventListener("click", openViewer);
  setMode(DEFAULT_MODE);

  if (CONTACT.tel) {
    var tel = document.getElementById("tel");
    tel.href = "tel:" + CONTACT.tel;
    tel.textContent = "找不到路？撥給" + (CONTACT.label || "當天聯絡人");
    document.getElementById("help").hidden = false;
  }

  var host = document.getElementById("sections");
  [["接駁資訊", INFO.shuttle], ["小提醒", INFO.notes]].forEach(function (b) {
    if (!b[1] || !String(b[1]).trim()) return;
    var s = el("section", "info");
    s.appendChild(el("h2", "sec", b[0]));
    s.appendChild(el("p", "", b[1]));
    host.appendChild(s);
  });
</script>
</body>
</html>
